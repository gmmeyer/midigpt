<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>midigpt — piano in your browser</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: #080912; color: #e8ecf6;
    font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, sans-serif;
    display: flex; flex-direction: column; align-items: center; min-height: 100vh;
  }
  header { text-align: center; margin: 28px 16px 8px; }
  h1 { margin: 0; font-size: 26px; letter-spacing: -0.5px; }
  h1 .g { color: #ffd34d; }
  .sub { color: #98a0b8; font-size: 13px; margin-top: 4px; }
  main { width: 100%; max-width: 860px; padding: 0 16px 40px; }
  .panel { background: #10121f; border: 1px solid #1e2136; border-radius: 14px; padding: 18px; margin-top: 16px; }
  .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 18px; }
  .controls label { font-size: 12px; color: #98a0b8; display: block; margin-bottom: 5px; }
  select, input[type=range] { width: 100%; }
  select { background: #191c30; color: #e8ecf6; border: 1px solid #2a2e48; border-radius: 8px; padding: 8px; }
  .val { color: #ffd34d; font-variant-numeric: tabular-nums; }
  .buttons { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
  button {
    background: #ffd34d; color: #1a1400; border: 0; border-radius: 9px;
    padding: 10px 18px; font-weight: 700; font-size: 14px; cursor: pointer;
  }
  button.ghost { background: #232842; color: #e8ecf6; }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  canvas#roll { width: 100%; height: 260px; border-radius: 12px; margin-top: 16px; display: block; background: #0e1020; }
  .status { margin-top: 12px; color: #aab2c6; font-size: 13px; min-height: 20px; }
  .pill { display: inline-block; background: #232842; color: #9fb0ff; border-radius: 999px; padding: 2px 10px; font-size: 11px; margin-left: 6px; }
  footer { color: #5a6178; font-size: 12px; margin: 8px 0 30px; text-align: center; padding: 0 16px; }
  a { color: #9fb0ff; }
</style>
</head>
<body>
  <header>
    <h1>midi<span class="g">gpt</span></h1>
    <div class="sub">a small transformer that improvises solo piano, running entirely in your browser<span class="pill" id="pill">…</span></div>
  </header>
  <main>
    <div class="panel">
      <div class="controls">
        <div>
          <label for="composer">composer</label>
          <select id="composer"></select>
        </div>
        <div>
          <label for="length">length</label>
          <select id="length">
            <option value="250" selected>short · ~1 min wait</option>
            <option value="500">medium · ~2 min</option>
            <option value="900">long · ~4 min</option>
          </select>
        </div>
        <div>
          <label for="temp">temperature · <span class="val" id="tempval">0.95</span></label>
          <input type="range" id="temp" min="0.6" max="1.3" step="0.01" value="0.95">
        </div>
        <div>
          <label for="topp">top-p · <span class="val" id="toppval">0.95</span></label>
          <input type="range" id="topp" min="0.5" max="1.0" step="0.01" value="0.95">
        </div>
      </div>
      <div class="buttons">
        <button id="generate" disabled>Generate</button>
        <button id="play" class="ghost" disabled>▶ Play</button>
        <button id="stop" class="ghost" disabled>■ Stop</button>
        <button id="download" class="ghost" disabled>⬇ MIDI</button>
      </div>
      <canvas id="roll" width="820" height="260"></canvas>
      <div class="status" id="status">loading…</div>
    </div>
    <footer>
      Generated on-device via onnxruntime-web (WebGPU / WASM). Temperature ≈ 0.95 tends to
      sound best — lower gets stuck, higher gets muddy. Trained on
      <a href="https://magenta.tensorflow.org/datasets/maestro">MAESTRO</a>.
    </footer>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tone@14.8.49/build/Tone.js"></script>
  <script src="app.js"></script>
</body>
</html>
