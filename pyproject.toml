[project]
name = "midigpt"
version = "0.1.0"
description = "An autoregressive transformer that generates expressive solo piano, trained on MAESTRO."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0",
    "torch>=2.7",
    "symusic>=0.5",
    "tqdm>=4.66",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/midigpt"]

# PyTorch with CUDA 12.8 wheels — required for RTX 5090 (Blackwell / sm_120).
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]
